<head>
    <meta charset="utf-8">

    <title>DOGDATA</title>
    <style>
        :root {
            /* stuff */
            --items-per-row: 6;
            --inventory-column-width: calc(var(--items-per-row) * 68px + 2px);
            --stuff-height: 1800px;
            --stuff-zoom-level: 0.3;

            --encoded-area-width: 700px;
            --encoded-area-height: 500px;
            --intro-buttons-scale: 0.7;

            /* colors */
            --color-background: #0f2648;
            --color-button-background: #178a4c;
            --color-button-background-hover: #13733f;
            --color-button-border: #0f6b3a;
            --color-button-border-hover: #0b5530;
            --color-adjustment-message-background: var(--color-button-border-hover);
            --color-adjustment-message-border: #38d848;
            --color-text: #e8eeff;
            --color-toast-message-outline: #000000;
            --color-shadow: rgba(0, 0, 0, 0.2);
            --color-shadow-heavy: rgba(0, 0, 0, 0.2);
            --color-inventory-item-border: #2b3b5e;
            --color-danger-overlay: rgba(255, 0, 0, 0.175);
            --color-danger: #ff0000;
            --color-warning: #ffbb00;
            --color-notice: #9df7b8;
            --color-section-background: #1a2238;
            --color-section-border: #27375a;
            --color-transparent: rgba(0, 0, 0, 0);
            --color-scrollbar-track: #3f5177;
            --color-scrollbar-thumb: #859dc2;


            /* layering */
            --z-index-inventory-item-hover-overlay: 100;
            --z-index-overlay-menus: 200;
            --z-index-overlay-menus-popups: 300;
            --z-index-laser-vision-overlay: 50;
            --z-index-adjustment-overlay: 500;
            --z-index-checkbox-thing: 1000;
        }

        #introduction-page-buttons {
            transform: scale(var(--intro-buttons-scale));
        }

        html::-webkit-scrollbar {
            display: none;
        }

        #pan-layer {
            display: contents;
        }

        #pan-layer.smooth-automatic-panning {
            transition: transform 0.125s ease-in-out;
        }

        html.has-inventory {
            overflow: clip;
        }

        html.has-inventory #pan-layer {
            display: block;
            position: fixed;
            left: 50%;
            top: 50%;
            width: 0;
            height: 0;
        }

        body:has(main#main.it-has-stuff),
        body:has(main#main.it-has-stuff) main#main {
            cursor: grab;
        }

        html.panning,
        html.panning * {
            cursor: grabbing !important;
            user-select: none;
        }

        .unselectable {
            -webkit-user-select: none;
            user-select: none;
        }

        html.disable-interactions,
        html.disable-interactions * {
            pointer-events: none !important;
        }

        * {
            box-sizing: border-box;
        }

        *,
        img {
            image-rendering: pixelated;
        }

        body {
            display: flex;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            justify-content: safe center;
            align-items: center;
            gap: 20px;
            background-color: var(--color-background);
            font-family: 'NDS', 'Courier New', Courier, monospace
        }

        main#main {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
            opacity: 1.0;
            transition: opacity 1s ease-in-out;
            max-width: 80vw;
            padding: 20px;
        }

        main#main.byebye {
            opacity: 0.0;
        }

        main#main.it-has-stuff {
            display: block;
            position: absolute;
            left: 0;
            top: 0;
            box-sizing: content-box;
            width: var(--inventory-column-width);
            max-width: none;
            min-width: var(--inventory-column-width);
            column-width: var(--inventory-column-width);
            column-gap: 12px;
            column-fill: auto;
            flex-direction: unset;
            height: var(--stuff-height);
            transform: scale(var(--stuff-zoom-level));
            transform-origin: 0 0;
            transition: opacity 1s ease-in-out;
            pointer-events: none;


            * {
                box-sizing: border-box;
            }

            &.zoomed-in-enough {
                pointer-events: auto;
            }

            div.section.removed,
            div.section.section-hidden {
                display: none;
            }
        }

        main#main.it-has-stuff.smooth-automatic-zooming {
            transition: transform 0.125s ease-in-out, opacity 1s ease-in-out;
        }

        main#main.it-has-stuff.force-zoom {
            pointer-events: none !important;
        }

        main#secondary {
            --removed-items-max-height: calc(100dvh - 85px);
            --removed-items-bottom: 16px;
            position: fixed;
            bottom: -200px;
            right: 16px;
            transition: bottom 0.5s ease-in-out;
            z-index: var(--z-index-overlay-menus);

            * {
                box-sizing: border-box;
            }

            button#screenshot-button {
                font-family: 'NDS', 'Courier New', Courier, sans-serif;
                background-color: var(--color-button-background);
                display: inline-flex;
                align-items: center;
                position: relative;
                justify-content: center;
                border-radius: 12px;
                padding: 0 20px;
                font-size: 24px;
                font-family: inherit;
                font-weight: 400;
                border: 3px solid var(--color-button-border);
                min-height: 45px;
                width: 290px;
                color: var(--color-text);
                -webkit-user-select: none;
                -moz-user-select: none;
                user-select: none;
                text-decoration: none;
                flex-direction: column;
                text-align: center;
                box-sizing: border-box;
                box-shadow: 4px 4px 4px var(--color-shadow);
            }

            button#screenshot-button:hover {
                background-color: var(--color-button-background-hover);
                border-color: var(--color-button-border-hover);
                cursor: pointer;
            }

            button#screenshot-button:active {
                top: 2px;
                left: 2px;
                box-shadow: 2px 2px 1px var(--color-shadow);
            }

            #section-removed-sections {
                display: none;
                position: fixed;
                right: 16px;
                bottom: 16px;
                width: 290px;
                margin: 0;
                padding-left: 20px;
                padding-right: 20px;
                flex-direction: column;
                flex-wrap: nowrap;
                align-items: center;
                gap: 0;
                overflow: visible;

                * {
                    box-sizing: border-box;
                }

                &>.title {
                    flex: 0 0 auto;
                }
            }

            #removed-sections-list {
                width: 100%;
                overflow: visible;
            }

            .section-in-removed-list-wrapper {
                display: flex;
                gap: 8px;
                min-height: 20px;
            }

            .section-in-removed-list-undo-button {
                padding: 0;
                border: 0;
                background: none;
                color: inherit;
                font: inherit;
                cursor: pointer;

                * {
                    box-sizing: border-box;
                }

                &:hover {
                    color: var(--color-danger);
                }
            }


            div.section#section-removed-items {
                display: flex;
                flex-direction: column;
                flex-wrap: nowrap;
                align-items: center;
                padding-left: 20px;
                padding-right: 20px;
                border-width: 3px;
                width: 290px;
                gap: 0;
                min-height: min(100px, var(--removed-items-max-height));
                max-height: var(--removed-items-max-height);
                overflow: hidden;
                transition: bottom 0.5s ease-in-out;

                position: fixed;
                bottom: -200px;
                right: 16px;

                * {
                    box-sizing: border-box;
                }

                >div.title,
                >div.message {
                    flex: 0 0 auto;
                }

                #removed-items-list {
                    display: flex;
                    flex-direction: column;
                    flex: 0 1 auto;
                    min-height: 0;
                    width: 100%;
                    overflow-y: auto;
                    overflow-x: hidden;
                    overscroll-behavior: contain;
                    scrollbar-width: thin;
                    scrollbar-color: var(--color-scrollbar-thumb) var(--color-scrollbar-track);
                }

                div.item-in-removed-list-wrapper {
                    display: flex;
                    flex-shrink: 0;
                    flex-direction: row;
                    align-self: start;
                    gap: 8px;
                    height: 0px;
                    overflow: hidden;
                    transition: height 0.25s ease-in-out;

                    * {

            const button = document.getElementById('script-button');
            const width = button.offsetWidth;
            button.style.width = width + 'px';
            if (window['OG_BUTTON_TEXT'] === undefined) {
                window['OG_BUTTON_TEXT'] = button.textContent;
            }
            const script = /* await decompress(SCRIPT_TO_GET_DATA); */ SCRIPT_TO_GET_DATA; // no reason to base64 encode it lmfao
            navigator.clipboard.writeText(script.trim())
                .then(() => {
                    button.textContent = "Copied ! ! !";
                    console.log(`Copied ${script.trim().length} characters to the clipboard. (That's a lot of characters...)`);
                })
                .catch(err => {
                    button.textContent = "There was an error copying the script???";
                    console.error('Failed to copy to clipboard automatically???: ', err);
                }).finally(() => {
                    setTimeout(() => {
                        button.textContent = window['OG_BUTTON_TEXT'];
                    }, 1000);
                });
        }

        async function render_element_as_png(
            elementId,
            filename = 'inventory.png',
            {
                scale = 1,
                bg = getComputedStyle(document.body).backgroundColor,
            } = {},
        ) {
            const element = document.getElementById(elementId);
            if (!element) throw new Error(`Element #${elementId} was not found.`);
            if (!Number.isFinite(scale) || scale <= 0) {
                throw new Error('The PNG scale must be a positive number.');
            }

            await document.fonts.ready;
            await document.fonts.load('16px "NDS"');
            const images = [...element.querySelectorAll('img')].filter(image => image.getClientRects().length > 0);
            await Promise.all(images.map(async image => {
                try {
                    await image.decode();
                } catch {
                    throw new Error(`Image didn't load: ${image.currentSrc || image.src}`);
                }
            }));

            const clone = element.cloneNode(true);
            const sources = [element, ...element.querySelectorAll('*')];
            const targets = [clone, ...clone.querySelectorAll('*')];
            const copies = new Map(sources.map((src, idx) => [src, targets[idx]]));

            sources.forEach((src, idx) => {
                const computed = getComputedStyle(src);
                for (const property of computed) {
                    targets[idx].style.setProperty(property, computed.getPropertyValue(property));
                }
                if (src.classList.contains('section')) {
                    targets[idx].style.setProperty('height', 'auto');
                }
                targets[idx].style.setProperty('transition', 'none');
                targets[idx].style.setProperty('animation', 'none');
            });

            Object.assign(clone.style, {
                margin: '0',
                transform: 'none',
                position: 'static',
                inset: 'auto',
                opacity: '1',
            });
            clone.querySelector('#screenshot-button')?.remove();
            clone.querySelectorAll('.section-remove-button').forEach(button => button.remove());

            const font_rules = [];
            const collect_fonts = rules => {
                for (const rule of rules) {
                    if (rule.type === CSSRule.FONT_FACE_RULE) font_rules.push(rule.cssText);
                    else if (rule.cssRules) collect_fonts(rule.cssRules);
                }
            };
            for (const sheet of document.styleSheets) {
                try {
                    collect_fonts(sheet.cssRules);
                } catch { }
            }

            const embed_img = async src => {
                if (src.startsWith('data:image/')) return src;
                throw new Error('Bad image data???');
            };

            await Promise.all(images.map(async src => {
                const target = copies.get(src);
                target.removeAttribute('srcset');
                target.removeAttribute('sizes');
                target.removeAttribute('crossorigin');
                target.removeAttribute('loading');
                if (target.parentElement?.tagName === 'PICTURE') {
                    target.parentElement.querySelectorAll('source').forEach(node => node.remove());
                }
                target.src = await embed_img(src.currentSrc || src.src);
                await target.decode();
            }));

            const bounds = elementId === 'main' ? get_panning_bounds() : element.getBoundingClientRect();
            const transform = getComputedStyle(element).transform;
            const matrix = new DOMMatrixReadOnly(transform === 'none' ? undefined : transform);
            const rendered_scale = Math.hypot(matrix.m11, matrix.m12) || 1;
            const width = Math.ceil(bounds.width / rendered_scale);
            const height = Math.ceil(bounds.height / rendered_scale);
            const ns = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(ns, 'svg');
            svg.setAttribute('width', String(width));
            svg.setAttribute('height', String(height));
            const external = document.createElementNS(ns, 'foreignObject');
            external.setAttribute('width', '100%');
            external.setAttribute('height', '100%');
            const style = document.createElement('style');
            style.textContent = font_rules.join('\n');
            clone.prepend(style);
            external.append(clone);
            svg.append(external);

            const svg_text = new XMLSerializer().serializeToString(svg);
            const snapshot = new Image();
            const loaded = new Promise((resolve, reject) => {
                snapshot.onload = resolve;
                snapshot.onerror = () => reject(new Error('Browser could not render the exported SVG.'));
            });
            snapshot.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg_text)}`;
            await loaded;

            const canvas = document.createElement('canvas');
            canvas.width = Math.ceil(width * scale);
            canvas.height = Math.ceil(height * scale);
            const context = canvas.getContext('2d');
            context.imageSmoothingEnabled = false;
            if (bg) {
                context.fillStyle = bg;
                context.fillRect(0, 0, canvas.width, canvas.height);
            }
            context.drawImage(snapshot, 0, 0, canvas.width, canvas.height);
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
            if (!blob) throw new Error('Failed to export canvas as PNG.');

            const download_url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = download_url;
            link.download = filename;
            document.body.append(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(download_url), 10000);
        }

    </script>

    <script>
        const ZOOM_SCROLLWHEL_STATE = {
            timeout: null,

        }

        const ZOOM_PANEL_STATE = {

        };

        const LAST_MOUSE_POSITION_STATE = {
            // relative to center
            x: 0,
            y: 0,
        }

        const ZOOM_BOUNDS = {
            MAX: 3.0,
            MIN: 0.05,
        }

        const PANNING_STATE = { x: 0, y: 0 };

        const LASER_VISION_UI_INFO_STATE = {
            element: null,
            animation_frame: null,
            hide_timeout: null,
        };

        const AUTOMATIC_VIEW_STATE = {
            update_id: 0,

        };

        const PAN_LAYER_BOUNDS_STATE = {
            animation_frame: null,
            resize_observer: null,
            mutation_observer: null,
            sections: new Set(),
        };

        const REMOVED_ITEM_MESSAGE_STATE = {
            get showing() {
                const message = document.getElementById('removed-items-list-message');
                return !message.classList.contains('closed');
            },
            queue: [],
            working: false,
            get element() {
                return document.getElementById('removed-items-list-message');
            },

        }

        const SCREENSHOT_BUTTON_POSITION_STATE = {

        };

        const REMOVED_ITEMS_PENDING_MOVEMENT = {
            reveal_timeout: null,
            hide_timeout: null,
            currently_showing: false,
            base_movement_timeout: null,
        };

        function upgrade_dogdata(dogdata) {
            const get_next_version = current => ALL_DOGDATA_VERSIONS[ALL_DOGDATA_VERSIONS.indexOf(current) + 1] ?? null;
            const format_upgrade_path = version => version?.replace(/[.-]/g, '_').toLocaleLowerCase() ?? 'unknown_version_or_error';
            const generate_next_upgrade_path_key = version => `${format_upgrade_path(version)}__to__${format_upgrade_path(get_next_version(version))}`;
            const errors = [];
            while (dogdata.version !== CURRENT_DOGDATA_VERSION) {
                const next_version = get_next_version(dogdata.version);
                const upgrade = UPGRADE_PATHS[generate_next_upgrade_path_key(dogdata.version)];
                if (next_version === null || typeof upgrade !== 'function') {
                    errors.push(`Missing upgrade path for ${dogdata.version}.`);
                    return { finished: false, errors };
                }
                upgrade(dogdata);
                if (dogdata.version !== next_version) {
                    errors.push(`Upgrade did not reach ${next_version}.`);
                    return { finished: false, errors };
                }
            }
            return { finished: true, errors };
        }

        function print_localstorage_usage_amount() {
            const ONE_MEGABYTE_IN_BYTES = 1 * 1024 * 1024; // 1,048,576 bytes
            const LOCALSTORAGE_LIMIT_PER_ORIGIN_IN_BYTES = 5 * ONE_MEGABYTE_IN_BYTES;
            const GAMECUBE_MEMORY_CARD_BLOCKS = 59; // a silly way of showing how much is used

            const bytes = (() => {
                let count = 0;
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    const value = localStorage.getItem(key);
                    /* utf-16, two bytes per character */
                    count += (key.length + value.length) * 2;
                }
                return count;
            })();

            const percentage = (bytes / LOCALSTORAGE_LIMIT_PER_ORIGIN_IN_BYTES);
            const blocks = Math.round(Math.max(Math.min(GAMECUBE_MEMORY_CARD_BLOCKS * percentage, GAMECUBE_MEMORY_CARD_BLOCKS), 1));

            if (blocks === GAMECUBE_MEMORY_CARD_BLOCKS) {
                console.warn('WARNING! localStorage use is at or near the limit! How did this happen???');
            }

            const bar = (() => {
                const medium = '\u{2592}';
                const dark = '\u{2593}';
                const solid = '\u{2588}';
                return (() => {
                    if (Math.round(blocks / 2) === 1) return solid;
                    if (Math.round(blocks / 2) === 2) return solid + dark;
                    if (Math.round(blocks / 2) === 3) return solid + dark;
                    if (Math.round(blocks / 2) === 4) return solid + dark + medium;
                    if (Math.round(blocks / 2) === 5) return solid + dark + medium;
                    if (Math.round(blocks / 2) === 6) return solid + dark + dark + medium;
                    if (Math.round(blocks / 2) >= 7) return solid + dark + dark + medium + medium;
                    return '?'; // how
                })().padStart(Math.round(blocks / 2), solid);
            })().padEnd(Math.round(GAMECUBE_MEMORY_CARD_BLOCKS / 2), '\u{2591}' /* light */);

            const lines_to_print_about_usage = [
                `Current blocks of memory used: ${blocks}/${GAMECUBE_MEMORY_CARD_BLOCKS} (~${(bytes / 1024).toFixed(0)}kb/${(LOCALSTORAGE_LIMIT_PER_ORIGIN_IN_BYTES / 1024).toFixed(0)}kb)`,
                `Usage: [${bar}]`
            ];

            const max_line_length = lines_to_print_about_usage.reduce((prev, curr) => curr.length > parseInt(prev) ? `${curr.length}` : prev, '-1');
            const separator = '-'.repeat(max_line_length);
            lines_to_print_about_usage.push(separator);
            lines_to_print_about_usage.unshift(separator);

            console.log(lines_to_print_about_usage.map(
                line => line.length >= max_line_length ? line : line.padStart(line.length + Math.floor((max_line_length - line - length) / 2), ' ').padEnd(max_line_length, ' ')
            ).join('\n'));
        }

        function set_footer_text(time) {
            const date = new Date(time);
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            const hh = String(date.getHours()).padStart(2, '0');
            const min = String(date.getMinutes()).padStart(2, '0');
            document.getElementById('infomatic').innerHTML = `DOGDATA tool by rei wolf&nbsp;&nbsp;|&nbsp;&nbsp;version: ${CURRENT_DOGDATA_VERSION}&nbsp;&nbsp;|&nbsp;&nbsp;localStorage last updated: ${yyyy}/${mm}/${dd} at ${hh}:${min}`;
        }

        function update_dogdata_in_localstorage(dogdata) {
            dogdata.last_updated = Date.now();
            console.log(`Updating localStorage['${DOGDATA_LOCALSTORAGE_KEY}'] with new data:`, dogdata);
            localStorage.setItem(DOGDATA_LOCALSTORAGE_KEY, JSON.stringify(dogdata));
            print_localstorage_usage_amount();
            set_footer_text(dogdata.last_updated);
        }

        function get_dogdata_from_localstorage() {
            console.log('Getting data from localStorage...');

            if (localStorage.getItem(DOGDATA_LOCALSTORAGE_KEY) === null) {
                console.warn('No previous data found in localStorage, creating new entry!');
                update_dogdata_in_localstorage({
                    removed: [],
                    removed_sections: [],
                    last_updated: Date.now(),
                    version: CURRENT_DOGDATA_VERSION,
                    dimensions: { '--items-per-row': 6, '--stuff-height': -1 },
                    encoded_base64_data: '',
                });
            }

            const dogdata = JSON.parse(localStorage.getItem(DOGDATA_LOCALSTORAGE_KEY));

            if (!ALL_DOGDATA_VERSIONS.some(version => dogdata?.version === version)) {
                console.error(`DOGDATA VERSION VERIFIBLY BAD (it was ${dogdata?.version}...), DELETING!`);
                localStorage.removeItem(DOGDATA_LOCALSTORAGE_KEY);
                return get_dogdata_from_localstorage();
            }

            const { removed, last_updated, version } = dogdata;
            let updated = false;

            if (version !== CURRENT_DOGDATA_VERSION) {
                console.warn('Data in localStorage out of date! Upgrading...');
                const result = upgrade_dogdata(dogdata);
                if (!result.finished) throw new Error(result.errors.join('\n'));
                updated = true;
                console.warn(`Upgraded localStorage['${DOGDATA_LOCALSTORAGE_KEY}'] from '${version}' to '${CURRENT_DOGDATA_VERSION}'!`);
            }
            if (!Array.isArray(dogdata.removed_sections)) {
                dogdata.removed_sections = [];
                updated = true;
            }
            if (normalize_dogdata_dimensions(dogdata)) updated = true;
            if (updated) localStorage.setItem(DOGDATA_LOCALSTORAGE_KEY, JSON.stringify(dogdata));

            set_footer_text(dogdata.last_updated);
            return dogdata;
        }



        function update_screenshot_button_position(options = { item_count: null, time: null, permanent: false }) {
            options = {
                item_count: null,
                time: null,
                permanent: false,
                ...options,
            };
            const { item_count, time, permanent } = options;
            const secondary = document.getElementById('secondary');
            const button = document.getElementById('screenshot-button');
            if (!secondary || !button) return;
            const maximum_bottom = Math.max(16, window.innerHeight - button.offsetHeight - 16);
            const removed_sections = document.getElementById('section-removed-sections');
            const sections_height = removed_sections && removed_sections.style.display !== 'none' ? removed_sections.offsetHeight + 8 : 0;
            secondary.style.setProperty('--removed-items-bottom', `${16 + sections_height}px`);
            secondary.style.setProperty('--removed-items-max-height', `${Math.max(0, maximum_bottom - 24 - sections_height)}px`);
            const dynamic_height_adjustment = 20 * Math.max(item_count ?? secondary.querySelectorAll('.item-in-removed-list-wrapper:not(.removing)').length, 1);
            if (time !== null) {
                const state = SCREENSHOT_BUTTON_POSITION_STATE;
                if (state.timeout !== null) {
                    clearTimeout(state.timeout);
                    state.timeout = null;
                }
                const update_id = ++state.update_id;
                if (permanent) {
                    state.original_transition = null;
                } else if (state.original_transition === null) {
                    state.original_transition = secondary.style.transition;
                }
                const seconds = `${(time / 1000).toFixed(6).replace(/\.?0+$/, '')}s`;
                secondary.style.transition = `bottom ${seconds} ease-in-out`;
                if (!permanent) {
                    state.timeout = setTimeout(() => {
                        if (state.update_id !== update_id) return;
                        secondary.style.transition = state.original_transition;
                        state.timeout = null;
                        state.original_transition = null;
                    }, time);
                }
            }
            const distance_from_bottom = 80 + 16 + 8 + dynamic_height_adjustment - 8 + (REMOVED_ITEM_MESSAGE_STATE.showing ? 22 : 0);
            secondary.style.bottom = REMOVED_ITEMS_PENDING_MOVEMENT.currently_showing
                ? `${Math.min(maximum_bottom, sections_height + Math.max(126, distance_from_bottom))}px`
                : `${Math.min(maximum_bottom, 16 + sections_height)}px`;
        }

        function show_removed_item_messages_from_queue() {
            const { queue, element, timeout } = REMOVED_ITEM_MESSAGE_STATE;
            element.classList.remove('closed');
            update_screenshot_button_position();
            const item = queue.shift();
            if (item.html) {
                element.innerHTML = `&nbsp;${item.content}&nbsp;`;
            } else {
                element.innerText = item.content;
                element.innerHTML = `&nbsp;${element.innerHTML}&nbsp;`;
            }
            setTimeout(() => {
                element.classList.add('closed');
                update_screenshot_button_position();
                setTimeout(() => {
                    if (queue.empty()) {
                        element.innerHTML = '';
                        REMOVED_ITEM_MESSAGE_STATE.working = false;
                        return;
                    }
                    show_removed_item_messages_from_queue();
                }, 1000)
            }, 3000);
        }

        function queue_removed_items_message(content, options = { html: true, initial_delay: null, ms_input: null }) {
            options = { html: true, initial_delay: null, ms_input: null, ...options };
            const { queue, working, delaying } = REMOVED_ITEM_MESSAGE_STATE;
            const { html, initial_delay, ms_input } = options;
            queue.push({ content, html });
            const ms = ((() => {
                switch (initial_delay) {
                    case 'tiny': return 100;
                    case 'short': return 500;
                    case 'medium': return 1000;
                    case 'long': return 2000;
                    case 'exact':
                        if (ms_input !== null && Number.isFinite(ms_input)) {
                            return Math.round(parseFloat(ms_input))
                        }
                        return 1000;
                    default: return 1000;
                }
            })());
            if (!working && !delaying) {
                REMOVED_ITEM_MESSAGE_STATE.working = true;
                if (initial_delay !== null) {
                    REMOVED_ITEM_MESSAGE_STATE.delaying = true;
                    setTimeout(() => {
                        show_removed_item_messages_from_queue();
                        REMOVED_ITEM_MESSAGE_STATE.delaying = false;
                    }, ms);
                } else {
                    show_removed_item_messages_from_queue();
                }
            }
        }

        function get_current_zoom(as_number = false) {
            const zoom = window.getComputedStyle(document.documentElement).getPropertyValue('--stuff-zoom-level').trim();
            return as_number ? parseFloat(zoom) : zoom;
        }

        function set_current_zoom(amount) {
            const zoom = Math.min(Math.max(Number(amount), ZOOM_BOUNDS.MIN), ZOOM_BOUNDS.MAX);
            document.documentElement.style.setProperty('--stuff-zoom-level', String(zoom));
            document.getElementById('zoom-label-display').innerText = `${zoom.toFixed(2)}x`;
            const main = () => document.getElementById('main').classList;
            if (zoom > 0.50) {
                if (!main().contains('zoomed-in-enough')) {
                    main().add('zoomed-in-enough');
                }
            } else {
                if (main().contains('zoomed-in-enough')) {
                    main().remove('zoomed-in-enough');
                }
            }
            update_pan_layer_bounds();
            schedule_pan_layer_bounds_update();
        }

        function update_pan_layer_bounds() {
            const layer = document.getElementById('pan-layer');
            if (!layer || !document.documentElement.classList.contains('has-inventory')) return;
            const bounds = get_panning_bounds();
            if (!bounds) return;
            for (const property of ['width', 'height']) {
                const value = `${Math.max(0, bounds[property])}px`;
                if (layer.style.getPropertyValue(property) !== value) layer.style.setProperty(property, value);
            }
        }

        function schedule_pan_layer_bounds_update() {
            const state = PAN_LAYER_BOUNDS_STATE;
            if (state.animation_frame !== null) return;
            state.animation_frame = requestAnimationFrame(() => {
                state.animation_frame = null;
                update_pan_layer_bounds();
                const main = document.getElementById('main');
                const scaling = main.getAnimations().some(animation =>
                    animation.playState === 'running' && animation.transitionProperty === 'transform'
                );
                if (scaling) schedule_pan_layer_bounds_update();
            });
        }

        function observe_pan_layer_bounds() {
            const state = PAN_LAYER_BOUNDS_STATE;
            if (state.resize_observer) return;
            const main = document.getElementById('main');
            state.resize_observer = new ResizeObserver(schedule_pan_layer_bounds_update);
            state.resize_observer.observe(main);
            const update_sections = () => {
                const sections = new Set(main.querySelectorAll(':scope > .section'));
                for (const section of state.sections) {
                    if (!sections.has(section)) state.resize_observer.unobserve(section);
                }
                for (const section of sections) {
                    if (!state.sections.has(section)) state.resize_observer.observe(section);
                }
                state.sections = sections;
            };
            update_sections();
            state.mutation_observer = new MutationObserver(records => {
                if (records.some(record => record.type === 'childList')) update_sections();
                schedule_pan_layer_bounds_update();
            });
            state.mutation_observer.observe(main, {
                childList: true,
                subtree: true,
                attributes: true,
                attributeFilter: ['class', 'style'],
            });
            main.addEventListener('load', schedule_pan_layer_bounds_update, true);
            main.addEventListener('transitionrun', schedule_pan_layer_bounds_update);
            main.addEventListener('transitionend', schedule_pan_layer_bounds_update);
            main.addEventListener('transitioncancel', schedule_pan_layer_bounds_update);
            window.addEventListener('resize', schedule_pan_layer_bounds_update);
            document.fonts.ready.then(schedule_pan_layer_bounds_update);
            document.fonts.addEventListener('loadingdone', schedule_pan_layer_bounds_update);
            schedule_pan_layer_bounds_update();
        }

        function get_rendered_view() {
            const main = document.getElementById('main');
            const transform = getComputedStyle(document.getElementById('pan-layer')).transform;
            const matrix = transform === 'none' ? new DOMMatrixReadOnly() : new DOMMatrixReadOnly(transform);
            const scale = getComputedStyle(main).transform;
            const scaled = scale === 'none' ? new DOMMatrixReadOnly() : new DOMMatrixReadOnly(scale);
            return { zoom: Math.hypot(scaled.m11, scaled.m12), pan: { x: matrix.m41, y: matrix.m42 } };
        }

        function stop_automatic_view() {
            const main = document.getElementById('main');
            const layer = document.getElementById('pan-layer');
            if (!main.classList.contains('smooth-automatic-zooming') && !layer.classList.contains('smooth-automatic-panning')) return;
            const view = get_rendered_view();
            const state = AUTOMATIC_VIEW_STATE;
            ++state.update_id;
            clearTimeout(state.timeout);
            state.timeout = null;
            state.held = false;
            main.classList.remove('smooth-automatic-zooming');
            layer.classList.remove('smooth-automatic-panning');
            set_current_zoom(view.zoom);
            set_panning(view.pan.x, view.pan.y);
        }

        function update_automatic_view(update, options = { zoom: true, pan: true }) {
            const state = AUTOMATIC_VIEW_STATE;
            if (state.measuring) return update();
            const main = document.getElementById('main');
            const layer = document.getElementById('pan-layer');
            if (!layer || !main.classList.contains('it-has-stuff')) {
                state.measuring = true;
                try { return update(); }
                finally { state.measuring = false; }
            }
            options = { zoom: true, pan: true, ...options };
            const start = get_rendered_view();
            const update_id = ++state.update_id;
            clearTimeout(state.timeout);
            state.timeout = null;
            const transitions = [main, layer].map(element => ({
                element,
                value: element.style.getPropertyValue('transition'),
                priority: element.style.getPropertyPriority('transition'),
            }));

            let result;
            let target;
            state.measuring = true;
            try {
                for (const { element } of transitions) element.style.setProperty('transition', 'none', 'important');
                result = update();
                target = { zoom: get_current_zoom(true), pan: { ...PANNING_STATE } };
                set_current_zoom(start.zoom);
                set_panning(start.pan.x, start.pan.y);
                main.getBoundingClientRect();
                main.classList.toggle('smooth-automatic-zooming', options.zoom || Math.abs(start.zoom - target.zoom) > 1e-6);
                layer.classList.toggle('smooth-automatic-panning', options.pan || Math.abs(start.pan.x - target.pan.x) > 1e-6 || Math.abs(start.pan.y - target.pan.y) > 1e-6);
            } catch (error) {
                set_current_zoom(start.zoom);
                set_panning(start.pan.x, start.pan.y);
                state.held = false;
                main.classList.remove('smooth-automatic-zooming');
                layer.classList.remove('smooth-automatic-panning');
                throw error;
            } finally {
                state.measuring = false;
                for (const { element, value, priority } of transitions) {
                    if (value) element.style.setProperty('transition', value, priority);
                    else element.style.removeProperty('transition');
                }
            }

            main.getBoundingClientRect();
            set_current_zoom(target.zoom);
            set_panning(target.pan.x, target.pan.y);

            const finish = () => {
                if (state.update_id !== update_id) return;
                state.timeout = null;
                if (state.held) return;
                main.classList.remove('smooth-automatic-zooming');
                layer.classList.remove('smooth-automatic-panning');
            };
            const animations = [main, layer].flatMap(element => element.getAnimations().filter(animation =>
                animation.transitionProperty === 'transform'
            ));
            if (animations.length) Promise.allSettled(animations.map(animation => animation.finished)).then(finish);
            else state.timeout = setTimeout(finish, 125);
            return result;
        }

        function get_visible_sections() {
            return [...document.querySelectorAll('#main > .section')].filter(section => {
                const style = getComputedStyle(section);
                return style.display !== 'none' && style.visibility === 'visible' && section.getClientRects().length > 0;
            });
        }

        function get_removed_sections_with_items_in_removed_list() {
            return [...document.querySelectorAll('#main > .section.removed:not(.section-hidden)')];
        }

        function get_panning_bounds(section_name = null) {
            const main = document.getElementById('main');
            if (!main.classList.contains('it-has-stuff')) return null;

            const sections = get_visible_sections();
            const name = section_name === null ? null : String(section_name).simplify();
            const section = name === null ? null : sections.find(element =>
                element.id === name || element.id === `section-${name}` ||
                element.querySelector('.title').textContent.simplify() === name
            );
            if (name !== null && !section) return null;

            const content = { left: Infinity, top: Infinity, right: -Infinity, bottom: -Infinity };
            for (const element of section ? [section] : sections) {
                // include overflowing items
                const elements = [element, ...element.querySelectorAll(':scope > .title, :scope > .item-wrapper:not(.removed)')];
                for (const child of elements) {
                    for (const rect of child.getClientRects()) {
                        content.left = Math.min(content.left, rect.left);
                        content.top = Math.min(content.top, rect.top);
                        content.right = Math.max(content.right, rect.right);
                        content.bottom = Math.max(content.bottom, rect.bottom);
                    }
                }
            }
            if (section) {
                return {
                    left: content.left,
                    top: content.top,
                    width: content.right - content.left,
                    height: content.bottom - content.top,
                };
            }
            const origin = main.getBoundingClientRect();
            const style = getComputedStyle(main);
            const transform = new DOMMatrixReadOnly(style.transform === 'none' ? undefined : style.transform);
            const scale = Math.hypot(transform.m11, transform.m12) || 1;
            const padding = {
                left: parseFloat(style.paddingLeft) || 0,
                top: parseFloat(style.paddingTop) || 0,
                right: parseFloat(style.paddingRight) || 0,
                bottom: parseFloat(style.paddingBottom) || 0,
            };
            return {
                left: origin.left,
                top: origin.top,
                width: Math.max(padding.left * scale, content.right - origin.left) + padding.right * scale,
                height: Math.max(padding.top * scale, content.bottom - origin.top) + padding.bottom * scale,
            };
        }

        function set_panning(x, y) {
            document.getElementById('pan-layer')?.dispatchEvent(new CustomEvent('adjust-panning', {
                detail: { x: x - PANNING_STATE.x, y: y - PANNING_STATE.y },
            }));
        }

        function center_panning(section_name = null) {
            if (!AUTOMATIC_VIEW_STATE.measuring) return update_automatic_view(() => center_panning(section_name), { zoom: false });
            const bounds = get_panning_bounds(section_name);
            if (!bounds) return false;
            set_panning(
                PANNING_STATE.x + window.innerWidth / 2 - (bounds.left + bounds.width / 2),
                PANNING_STATE.y + window.innerHeight / 2 - (bounds.top + bounds.height / 2)
            );
            return true;
        }

        function zoom_to_fit(section_name = null) {
            if (!AUTOMATIC_VIEW_STATE.measuring) return update_automatic_view(() => zoom_to_fit(section_name));
            let bounds = get_panning_bounds(section_name);
            if (!bounds) return;
            const factor = {
                height: 0.95,
                width: 0.95,
            };
            const zoom = get_rendered_view().zoom;
            const step = 0.05;
            const available = { width: window.innerWidth * factor.width, height: window.innerHeight * factor.height };
            const target = Math.min(available.width / (bounds.width / zoom), available.height / (bounds.height / zoom));
            let amount = Math.min(Math.max(Math.floor((target + 0.001) / step) * step, ZOOM_BOUNDS.MIN), ZOOM_BOUNDS.MAX);
            set_current_zoom(Number(amount.toFixed(2)));

            // remeasure after zoom
            bounds = get_panning_bounds(section_name);
            while ((bounds.width > available.width + 0.5 || bounds.height > available.height + 0.5) && amount > ZOOM_BOUNDS.MIN) {
                amount = Math.max(ZOOM_BOUNDS.MIN, Number((amount - step).toFixed(2)));
                set_current_zoom(amount);
                bounds = get_panning_bounds(section_name);
            }
            center_panning(section_name);
            return get_current_zoom(true);
        }

        function set_zoom_panel_minimized(minimized) {
            const state = ZOOM_PANEL_STATE;
            const controls = document.querySelector('main#view-controls div.section.controls div.zoom-controls');
            if (controls.classList.contains('minimized') === minimized) return;
            clearTimeout(state.opening_timeout);
            state.opening_timeout = null;
            if (minimized) {
                controls.classList.remove('opening');
                controls.classList.add('minimized');
            } else {
                controls.classList.add('opening');
                controls.classList.remove('minimized');
                state.opening_timeout = setTimeout(() => {
                    controls.classList.remove('opening');
                    state.opening_timeout = null;
                }, 454);
            }
        }

        function update_zoom_panel() {
            const state = ZOOM_PANEL_STATE;
            const controls = document.getElementById('view-controls');
            clearTimeout(state.collapse_timeout);
            state.collapse_timeout = null;
            if (document.getElementById('minimal-zoom-options').checked) {
                set_zoom_panel_minimized(true);

            }
            if (!controls.classList.contains('show')) return;
            const active = () => controls.matches(':hover') ||
                controls.classList.contains('dragging-slider') || controls.classList.contains('zooming');
            if (active()) {
                set_zoom_panel_minimized(false);

            state.collapse_timeout = setTimeout(() => {
                state.collapse_timeout = null;
                if (document.getElementById('minimal-zoom-options').checked || !active()) {

                }

        function activate_zoom_panel() {

        function clear_ui_info_laser_vision_box() {
            const state = LASER_VISION_UI_INFO_STATE;
            cancelAnimationFrame(state.animation_frame);
            clearTimeout(state.hide_timeout);
            state.element?.classList.remove('laser-vision-ui-info-target-element');
            state.element = null;
            state.animation_frame = null;
            state.hide_timeout = null;
            const collection = document.getElementById('laser-vision-ui-info');
            collection.classList.remove('show');
            collection.replaceChildren();
        }

        function draw_ui_info_laser_vision_box_around_element(element = null) {
            const state = LASER_VISION_UI_INFO_STATE;
            const collection = document.getElementById('laser-vision-ui-info');
            if (element && state.element !== element) {
                state.element?.classList.remove('laser-vision-ui-info-target-element');
                state.element = element;
                element.classList.add('laser-vision-ui-info-target-element');
            }
            const target = state.element;
            const fragments = target?.isConnected ? [...target.getClientRects()] : [];
            if (!fragments.length || getComputedStyle(target).visibility !== 'visible') {
                clear_ui_info_laser_vision_box();
                return false;
            }
            const thickness = Math.max(0, parseFloat(getComputedStyle(collection).getPropertyValue('--thickness')) || 1);
            const existing = new Map([...collection.children].map(box => [box.id, box]));
            const added = document.createDocumentFragment();
            fragments.forEach((rect, index) => {
                const { left, right, top, bottom } = rect;
                if (right < 0 || bottom < 0 || left > innerWidth || top > innerHeight) return;
                const boxes = {
                    left: [left - thickness, top, left, bottom],
                    right: [right, top, right + thickness, bottom],
                    top: [left - thickness, top - thickness, right + thickness, top],
                    bottom: [left - thickness, bottom, right + thickness, bottom + thickness],
                };
                Object.entries(boxes).forEach(([side, coords]) => {
                    const id = `box-ui-info-${side}${index ? `-${index}` : ''}`;
                    const box = existing.get(id) ?? document.createElement('div');
                    existing.delete(id);
                    box.id = id;
                    box.classList.add('box');
                    ['--tl-x', '--tl-y', '--br-x', '--br-y'].forEach((property, coordinate) => {
                        const value = `${coords[coordinate]}px`;
                        if (box.style.getPropertyValue(property) !== value) box.style.setProperty(property, value);
                    });
                    if (!box.parentNode) added.appendChild(box);
                });
            });
            existing.forEach(box => box.remove());
            collection.appendChild(added);
            return true;
        }

        function activate_section_navigation() {
            const trigger = document.getElementById('jump-to-section');
            const navigation = trigger.closest('.section-navigation');
            const menu = document.getElementById('section-navigation-menu');
            const list = document.getElementById('section-navigation-list');
            let hide_timeout = null;
            let fadeout_timeout = null;

            const update_highlight = () => {
                const state = LASER_VISION_UI_INFO_STATE;
                state.animation_frame = null;
                if (draw_ui_info_laser_vision_box_around_element()) {
                    state.animation_frame = requestAnimationFrame(update_highlight);
                }
            };
            const show_highlight = element => {
                const state = LASER_VISION_UI_INFO_STATE;
                clearTimeout(state.hide_timeout);
                state.hide_timeout = null;
                if (!draw_ui_info_laser_vision_box_around_element(element)) return;
                document.getElementById('laser-vision-ui-info').classList.add('show');
                if (state.animation_frame === null) state.animation_frame = requestAnimationFrame(update_highlight);
            };
            const hide_highlight = () => {
                const state = LASER_VISION_UI_INFO_STATE;
                document.getElementById('laser-vision-ui-info').classList.remove('show');
                clearTimeout(state.hide_timeout);
                state.hide_timeout = setTimeout(clear_ui_info_laser_vision_box, 1963);
            };

            const update_sections = () => {
                const entries = [
                    ...get_visible_sections(),
                    ...get_removed_sections_with_items_in_removed_list()
                ].map(section => ({
                    name: section.id,
                    title: section.querySelector('.title').textContent.trim(),
                    removed: section.classList.contains('removed'),
                }));
                list.replaceChildren(...entries.map(entry => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.classList.add('section-navigation-item');
                    if (entry.removed) button.classList.add('removed');
                    button.textContent = entry.title;
                    button.onclick = () => {
                        zoom_to_fit(entry.name);
                    };
                    button.addEventListener('mouseenter', () => show_highlight(document.getElementById(entry.name)));
                    button.addEventListener('mouseleave', hide_highlight);
                    return button;
                }));
            };

            const open = () => {
                clearTimeout(hide_timeout);
                hide_timeout = null;
                clearTimeout(fadeout_timeout);
                fadeout_timeout = null;
                const was_open = navigation.classList.contains('open');
                navigation.classList.add('open');
                if (navigation.classList.contains('fading-out')) {
                    navigation.classList.remove('fading-out');
                }
                if (!was_open) update_sections();
            };
            const close = () => {
                hide_highlight();
                clearTimeout(hide_timeout);
                fadeout_timeout = setTimeout(() => {
                    fadeout_timeout = null;
                    if (!navigation.matches(':hover')) {
                        navigation.classList.add('fading-out');
                    }
                    hide_timeout = setTimeout(() => {
                        hide_timeout = null;
                        if (!navigation.matches(':hover')) navigation.classList.remove('open');
                        navigation.classList.remove('fading-out');
                    }, 455);
                }, 500);
            };
            navigation.addEventListener('mouseenter', open);
            navigation.addEventListener('mouseleave', close);
            menu.addEventListener('wheel', evt => evt.stopPropagation(), { passive: true });
        }

        function activate_panning_and_scrollwheel_zooming() {
            const page = document.documentElement;
            const main = document.getElementById('main');
            const layer = document.createElement('div');
            layer.id = 'pan-layer';
            main.before(layer);
            layer.appendChild(main);
            observe_pan_layer_bounds();
            const pan = PANNING_STATE;
            let drag = null;

            layer.addEventListener('adjust-panning', evt => {
                const { x, y } = evt.detail;
                pan.x += x;
                pan.y += y;
                if (drag) {
                    drag.pan_x += x;
                    drag.pan_y += y;
                }
                layer.style.transform = `translate(${pan.x}px, ${pan.y}px)`;
            });

            const stop = evt => {
                if (!drag || (evt?.pointerId !== undefined && evt.pointerId !== drag.pointer_id)) return;
                const pointer_id = drag.pointer_id;
                drag = null;
                page.classList.remove('panning');
                if (page.hasPointerCapture(pointer_id)) page.releasePointerCapture(pointer_id);
            };

            page.addEventListener('pointerdown', evt => {
                if (evt.button !== 0 || !evt.isPrimary || evt.pointerType === 'touch' || evt.defaultPrevented) return;
                if (!page.classList.contains('has-inventory')) return;
                if (page.classList.contains('disable-interactions')) return;
                if (!(evt.target instanceof Element)) return;
                if (evt.target.closest('.section, button, a, input, textarea, select, [contenteditable], #secondary, #view-controls, #bottom-left-checkbox-thing')) return;

                stop_automatic_view();

                drag = {
                    pointer_id: evt.pointerId,
                    client_x: evt.clientX,
                    client_y: evt.clientY,
                    pan_x: pan.x,
                    pan_y: pan.y,
                };
                page.setPointerCapture(evt.pointerId);
                page.classList.add('panning');
                evt.preventDefault();
            });

            page.addEventListener('pointermove', evt => {
                if (!drag || evt.pointerId !== drag.pointer_id) return;
                if (!(evt.buttons & 1)) {
                    stop(evt);
                    return;
                }
                pan.x = drag.pan_x + evt.clientX - drag.client_x;
                pan.y = drag.pan_y + evt.clientY - drag.client_y;
                layer.style.transform = `translate(${pan.x}px, ${pan.y}px)`;
                evt.preventDefault();
            });

            page.addEventListener('pointermove', evt => {
                const { clientX, clientY } = evt;
                const { innerWidth, innerHeight } = window;
                const center = {
                    x: Math.round(innerWidth / 2),
                    y: Math.round(innerHeight / 2),
                };
                LAST_MOUSE_POSITION_STATE.x = (clientX - center.x) / center.x;
                LAST_MOUSE_POSITION_STATE.y = (clientY - center.y) / center.y;
            });

            page.addEventListener('wheel', (event) => {
                if (event.target instanceof Element && event.target.closest('#removed-items-list')) return;
                event.preventDefault();

                if (!ZOOM_SCROLLWHEL_STATE.active) { return; }
                if (document.getElementById('view-controls').classList.contains('dragging-slider')) return;

                stop_automatic_view();

                const center = {
                    x: Math.round(window.innerWidth / 2),
                    y: Math.round(window.innerHeight / 2),
                };

                const which = (() => {
                    if (event.deltaY < 0) {
                        console.log('Zooming In');
                        return 'in';
                    } else {
                        console.log('Zooming Out');
                        return 'out';
                    }
                })();

                if (zoom_bounds_check()[which]) return;

                LAST_MOUSE_POSITION_STATE.x = (event.clientX - center.x) / center.x;
                LAST_MOUSE_POSITION_STATE.y = (event.clientY - center.y) / center.y;

                const mousedown = new MouseEvent('mousedown', {
                    bubbles: true,
                    cancelable: true,
                    view: window,
                    clientX: event.clientX,
                    clientY: event.clientY,
                    button: MOUSE_BUTTON.LEFT
                });

                const mouseup = new MouseEvent('mouseup', {
                    bubbles: true,
                    cancelable: true,
                    view: window,
                    button: MOUSE_BUTTON.LEFT
                });

                const buttons = {
                    in: document.getElementById('zoom-in'),
                    out: document.getElementById('zoom-out'),
                }

                if (ZOOM_SCROLLWHEL_STATE.timeout !== null) {
                    const { timeout, which } = ZOOM_SCROLLWHEL_STATE;
                    clearTimeout(timeout);
                    buttons[which].dispatchEvent(mouseup);
                    buttons[which].classList.remove('fake-active');
                    ZOOM_SCROLLWHEL_STATE.timeout = null;
                    ZOOM_SCROLLWHEL_STATE.which = null;
                    ZOOM_SCROLLWHEL_STATE.scrollwheel_initated = false;
                }

                ZOOM_SCROLLWHEL_STATE.scrollwheel_initated = true;
                buttons[which].dispatchEvent(mousedown);
                buttons[which].classList.add('fake-active');
                ZOOM_SCROLLWHEL_STATE.timeout = setTimeout(() => {
                    buttons[which].dispatchEvent(mouseup);
                    ZOOM_SCROLLWHEL_STATE.which = null;
                    ZOOM_SCROLLWHEL_STATE.timeout = null;
                    ZOOM_SCROLLWHEL_STATE.scrollwheel_initated = false;
                    buttons[which].classList.remove('fake-active');
                }, 40);
                ZOOM_SCROLLWHEL_STATE.which = which;

            }, { passive: false });

            page.addEventListener('pointerup', stop);
            page.addEventListener('pointercancel', stop);
            page.addEventListener('lostpointercapture', stop);

            window.addEventListener('blur', () => stop());
        }

                slider.element.addEventListener('mousedown', evt => {
                    if (evt.button !== MOUSE_BUTTON.LEFT || adjustment !== null) return;
                    stop_automatic_view();
                    const { clientX, clientY } = evt;
                    const previous_view = { zoom: get_current_zoom(), pan: { ...PANNING_STATE } };
                    AUTOMATIC_VIEW_STATE.held = true;

                    document.documentElement.style.cursor = 'grabbing';
                    controls.classList.add('dragging-slider');

                    const adjusting = document.getElementById('adjusting-message');
                    adjusting.classList.add('show');

                    const computed = window.getComputedStyle(slider.element);

                    const starting_bg_pos_x = parseInt(computed.backgroundPositionX.noPx());
                    const starting_value = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(slider.css));

                    const start_client_xy = { clientX, clientY };

                    console.log('Started dragging...', start_client_xy);
                    console.log('Current background X position', starting_bg_pos_x);

                    const mousemove = move_evt => {
                        const { clientX, clientY } = move_evt;
                        const delta = clientX - start_client_xy.clientX;
                        slider.element.style.backgroundPositionX = `${starting_bg_pos_x + delta}px`;
                        const new_value = Math.max(1, Math.round(starting_value + delta));
                        label.innerText = `${new_value}px`;
                        console.log('Dragging...', start_client_xy, clientX, clientY, computed.backgroundPositionX);
                        document.documentElement.style.setProperty(slider.css, `${new_value}px`);
                        zoom_to_fit();
                    };

                    const mouseup = () => {
                        if (adjustment !== mouseup) return;
                        adjustment = null;
                        console.log('Finished dragging.');
                        window.removeEventListener('mousemove', mousemove);
                        window.removeEventListener('mouseup', mouseup);
                        window.removeEventListener('blur', mouseup);
                        window.removeEventListener('resize', fit_view);
                        document.documentElement.style.cursor = 'auto';
                        document.documentElement.classList.remove('disable-interactions');
                        controls.classList.remove('dragging-slider');
                        update_zoom_panel();
                        adjusting.classList.remove('show');
                        AUTOMATIC_VIEW_STATE.held = false;
                        update_automatic_view(() => {
                            set_current_zoom(previous_view.zoom);
                            set_panning(previous_view.pan.x, previous_view.pan.y);
                        });
                        const finished_value = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(slider.css));
                        const dogdata = get_dogdata_from_localstorage();
                        dogdata.dimensions[slider.css] = finished_value;
                        console.log('Updating "' + slider.css + '" in dogdata in localStorage!');
                        update_dogdata_in_localstorage(dogdata);
                    };

                    adjustment = mouseup;

                    zoom_to_fit();
                    window.addEventListener('mousemove', mousemove);
                    window.addEventListener('mouseup', mouseup);
                    window.addEventListener('blur', mouseup);
                    window.addEventListener('resize', fit_view);
                });
                const dogdata = get_dogdata_from_localstorage();
                const previously_set_value = dogdata.dimensions[slider.css];
                if (previously_set_value !== -1 && Number.isFinite(previously_set_value)) {
                    label.innerText = `${previously_set_value}px`;
                    console.log('Setting "' + slider.css + '" based on dogdata in localStorage...');
                    document.documentElement.style.setProperty(slider.css, `${previously_set_value}px`);
                    zoom_to_fit();
                } else {
                    console.log('User has not adjusted "' + slider.css + '" yet, skipping...');
                }
            });
        }

        function activate_zoom() {
            const controls = document.getElementById('view-controls');
            const zoom = {
                scaling: 0.05,
                css: '--stuff-zoom-level',
                in: {
                    element: document.getElementById('zoom-in'),
                    direction: 'positive',
                },
                out: {
                    element: document.getElementById('zoom-out'),
                    direction: 'negative',
                },
                label: document.getElementById('zoom-label-display'),
                reset: document.getElementById('zoom-reset'),
            }

            const format_float = n => n.toFixed(2);

            let interval = null;
            let additional = null;
            let initial = null;

            const adjust_panning = (prev, scrollwheel_initated = ZOOM_SCROLLWHEL_STATE.scrollwheel_initated) => {
                const layer = document.getElementById('pan-layer');
                const main = document.getElementById('main');

                if (!layer || !main.classList.contains('it-has-stuff'))
                    return;

                const center = {
                    x: Math.round(window.innerWidth / 2),
                    y: Math.round(window.innerHeight / 2),
                };
                const bounds = main.getBoundingClientRect();
                const ratio = get_rendered_view().zoom / prev.zoom;

                if (scrollwheel_initated) {
                    const mouse = {
                        x: center.x * (1 + LAST_MOUSE_POSITION_STATE.x),
                        y: center.y * (1 + LAST_MOUSE_POSITION_STATE.y),
                    };
                    layer.dispatchEvent(new CustomEvent('adjust-panning', {
                        detail: {
                            x: mouse.x - (bounds.left + (mouse.x - prev.bounds.left) * ratio),
                            y: mouse.y - (bounds.top + (mouse.y - prev.bounds.top) * ratio),
                        },
                    }));
                } else {
                    layer.dispatchEvent(new CustomEvent('adjust-panning', {
                        detail: {
                            x: center.x - (bounds.left + (center.x - prev.bounds.left) * ratio),
                            y: center.y - (bounds.top + (center.y - prev.bounds.top) * ratio),
                        },
                    }));
                }
            };

            zoom.reset.onclick = () => {
                if (interval) return; // idk but who knoews ...
                stop_automatic_view();
                update_automatic_view(() => {
                    const main = document.getElementById('main');
                    const prev = {
                        zoom: get_rendered_view().zoom,
                        bounds: main.getBoundingClientRect(),
                    };
                    set_current_zoom(1);
                    adjust_panning(prev, false);
                });
            };

            document.getElementById('zoom-fit').onclick = () => {
                if (interval) return;
                zoom_to_fit();
            };

            document.getElementById('center-inventory').onclick = () => {
                if (interval) return;
                center_panning();
            };

            for (const button of [zoom.in, zoom.out]) {
                const { element, direction } = button;

                const scale = () => {
                    const main = document.getElementById('main');
                    const prev = {
                        zoom: get_rendered_view().zoom,
                        bounds: main.getBoundingClientRect(),
                    }
                    const initial_additional = additional;
                    additional = additional + zoom.scaling * ((() => {
                        switch (direction) {
                            case 'positive': return 1.0;
                            case 'negative': return -1.0;
                            default: return 0.0;
                        }
                    })());
                    const amount = format_float(Math.min(Math.max(initial + additional, ZOOM_BOUNDS.MIN), ZOOM_BOUNDS.MAX));
                    set_current_zoom(amount);
                    adjust_panning(prev);
                    console.log(`Initial scaling was ${initial}, additional is ${additional}, new target is ${amount}`);
                }

                const stop = () => {
                    console.log('Stopping zoom...');
                    const was_zooming = controls.classList.contains('zooming');
                    clearInterval(interval);
                    interval = null;
                    additional = null;
                    initial = null;
                    window.removeEventListener('mouseup', stop);
                    document.documentElement.style.cursor = 'auto';
                    document.documentElement.classList.remove('disable-interactions');
                    controls.classList.remove('zooming');
                    if (was_zooming) update_zoom_panel();
                };

                const start = evt => {
                    console.log('Starting zoom...');
                    if (interval) return;
                    stop_automatic_view();
                    const bounds = controls.getBoundingClientRect();
                    controls.classList.toggle('zooming', !ZOOM_SCROLLWHEL_STATE.scrollwheel_initated || (
                        evt.clientX >= bounds.left && evt.clientX <= bounds.right &&
                        evt.clientY >= bounds.top && evt.clientY <= bounds.bottom
                    ));
                    const current_zoom_css_value = get_current_zoom();
                    console.log(`Zoom property value (${zoom.css}) -> ${current_zoom_css_value}... parsed as float: ${parseFloat(current_zoom_css_value)}`)
                    initial = parseFloat(current_zoom_css_value);
                    additional = 0.0;
                    scale();
                    interval = setInterval(scale, 50);
                    document.documentElement.style.cursor = ((() => {
                        switch (direction) {
                            case 'positive': return 'zoom-in';
                            case 'negative': return 'zoom-out';
                            default: return 'zoom-in';
                        }
                    })());
                    document.documentElement.classList.add('disable-interactions');
                    if (controls.classList.contains('zooming')) update_zoom_panel();
                    window.addEventListener('mouseup', stop);
                }

                element.addEventListener('mousedown', start);
            };
        }

        function fill_in_user_stored_base64_data(data) {
            const identifier = '------------';
            const textarea = document.getElementById('encoded-data');
            textarea.value = (
                `${identifier}START-RESTORED-BASE64-DATA-FROM-LOCAL-STORAGE${identifier}\n` +
                `${data}\n` +
                `${identifier}END-RESTORED-BASE64-DATA-FROM-LOCAL-STORAGE${identifier}`
            ).trim();
            const event = new InputEvent('input', {
                bubbles: true,
                cancelable: true,
                inputType: 'insertText',
                data: null
            });
            return textarea.dispatchEvent(event);
        }

        async function decode_base64_data(base64) {
            try {
                console.log('Attempting to parse...');
                const data = JSON.parse(await decompress(base64));
                if (data === null || typeof data !== 'object') {
                    console.error('Bad data');
                    return null;
                }
                console.log('Data object decoded:', data);
                return data;
            } catch (error) {
                console.error('ERROR DECODING BASE64 DATA!', error);
                return null;
            }
        }

        (() => {
            String.prototype.noPx = function () {
                return this.substring(0, this.length - 2 <= 1 ? 1 : this.length - 2);
            };

            String.prototype.empty = function () {
                return this.length === 0;
            }

            String.prototype.simplify = function () {
                return this.trim().toLocaleLowerCase();
            }

            Array.prototype.empty = function () {
                return this.length === 0;
            }

            activate_sliders();
            activate_zoom();
            activate_zoom_panel();
            activate_panning_and_scrollwheel_zooming();
            activate_section_navigation();

            let pulled_from_localstorage = false;
            get_dogdata_from_localstorage(); // non assignment just to update footer text lol

            const put_user_pasted_data_in_localstorage = base64 => {
                console.log('Saving user-provided data for future sessions...');

                if (typeof base64 !== 'string') {
                    console.error('Did not get string??? What???');
                    return;
                }

                const dogdata = get_dogdata_from_localstorage();
                dogdata.encoded_base64_data = base64;
                update_dogdata_in_localstorage(dogdata);
            }

            const existing_base64_userdata_or_null = () => {
                return get_dogdata_from_localstorage().encoded_base64_data.empty()
                    ? null
                    : get_dogdata_from_localstorage().encoded_base64_data;
            };

            const previously_saved_data = existing_base64_userdata_or_null();
            if (previously_saved_data !== null) {
                pulled_from_localstorage = true;
                console.log('Existing data confirmed good! Activating restore button...');
                setTimeout(() => {
                    const buttons = {
                        script: document.getElementById('script-button'),
                        localstorage: document.getElementById('use-localstorage-button'),
                    };
                    buttons.script.classList.remove('solo');
                    buttons.localstorage.classList.remove('bye');
                    buttons.localstorage.onclick = () => {
                        fill_in_user_stored_base64_data(previously_saved_data);
                    };
                }, 475);
            }

            let decoding = false;
            let started_importing = false;
            const textarea = document.getElementById('encoded-data');
            textarea.addEventListener('input', async evt => {
                if (decoding || started_importing) return;
                console.log('Input event for textarea gotten...');
                const input = evt.target.value.trim();
                const lines = input.split('\n').map(line => line.trim());
                const identifier = '------------';
                if (
                    lines[0].startsWith(identifier) &&
                    lines[0].endsWith(identifier) &&
                    lines[lines.length - 1].startsWith(identifier) &&
                    lines[lines.length - 1].endsWith(identifier)
                ) {
                    lines.splice(0, 1);
                    lines.splice(lines.length - 1, 1);
                    const base64 = lines.join('').trim();
                    decoding = true;
                    const data = await decode_base64_data(base64);
                    decoding = false;
                    if (data['does_this_work'] !== undefined && data.does_this_work === true) {
                        started_importing = true;
                        if (!pulled_from_localstorage) put_user_pasted_data_in_localstorage(base64);
                        start(data);
                    } else {
                        console.error('Good data recieved, but the wrong data???');
                    }
                } else {
                    console.warn('Wrong data...');
                }
            });
        })();
    </script>
